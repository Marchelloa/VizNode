<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.bank.css">
    <title>VizNode Bank Presentation</title>
</head>
<body>
    <div class="bank-shell">
        <header class="bank-header">
            <div class="bank-brand" aria-label="VizNode Bank">
                <span class="bank-brand__mark" aria-hidden="true">V</span>
                <span class="bank-brand__name">
                    <strong>VizNode</strong>
                    <small>Personal Banking</small>
                </span>
            </div>

            <div class="session-status">
                <span class="session-status__dot" aria-hidden="true"></span>
                <span>Local secure session</span>
            </div>
        </header>

        <main id="app" class="bank-panel"></main>

        <footer class="bank-footer">
            <span>Declarative interface</span>
            <span aria-hidden="true">·</span>
            <span>Shared application state</span>
        </footer>
    </div>

    <script type="module" src="./src/browser-demo.js"></script>
</body>
</html>
